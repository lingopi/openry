    on_success: shell_json_fallback
  - ref: shell_json_fallback
    on_success: shell_interpolation
  - ref: shell_interpolation
    on_success: shell_payload_from_ref
  - ref: shell_payload_from_ref
    on_success: shell_env_interpolation
  - ref: shell_env_interpolation
    on_success: shell_overflow_truncate
