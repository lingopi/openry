# ============================================================================
# Conditional Routing — when 单条件路由示例
# ============================================================================
# 演示：validation_routing 中 when 条件路由
#   - category="safe" → 直接完成
#   - category="dangerous" → 路由到 handle_dangerous 步骤
#
# 核心概念：validation_routing 在硬验证通过后执行，支持多分支决策
# ============================================================================
name: conditional_routing
version: "1.0"
description: "演示 when 条件路由：根据 category 值自动选择不同处理路径"
timeout_minutes: 5
max_retries: 0

sub_steps:
  # ── 分类检查（带条件路由）──
  - id: check_category
    kind: agent
    description: |
      你需要分析当前情况并决定 category 值：
      1. 使用 openry_run 执行 'echo "checking category"'
      2. 决定 category 值为 "safe" 或 "dangerous"
      3. 使用 openry_status 上报 completed，payload 含 category 字段

      系统会根据 category 值自动路由到不同步骤：
      - safe → 直接完成
      - dangerous → 进入风险处理步骤
    on_success: done
    on_failure: abort
    max_tool_calls: 5
    max_sub_step_retries: 2
    expect_payload: true
    payload_keys: [category]
    on_validation_fail: retry_current

    # 条件路由：根据 category 值分流
    validation_routing:
      - when:
          type: payload_value_equals
          key: category
          value: "safe"
        on_match: done              # 安全 → 直接完成
        on_mismatch: handle_dangerous  # 非安全 → 进入处理步骤
        on_mismatch_message: "检测到风险情况，需要特殊处理"

  # ── 风险处理步骤 ──
  - id: handle_dangerous
    kind: agent
    description: |
      你被路由到了风险处理步骤。
      1. 使用 openry_run 执行 'echo "handling dangerous situation"'
      2. 上报 payload 含 escalated=true 和 reason 字段
      3. 使用 openry_status 上报 completed
    on_success: done
    on_failure: abort
    max_tool_calls: 5
    max_sub_step_retries: 2
    expect_payload: true
    payload_keys: [escalated, reason]
    on_validation_fail: retry_current
