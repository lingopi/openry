# ============================================================================
# shell_payload_from_ref — 测试 payload_from 跨步引用
# ============================================================================
name: shell_payload_from_ref
version: "1.0"
description: "Phase 3b payload_from 测试：跳过中间 step，直引指定的 upstream step"
timeout_minutes: 1
max_retries: 0

sub_steps:
  # Step 1: 产出目标 payload
  - id: json_source
    kind: shell
    command: "python3 /Users/yifan/Desktop/OpenRY/example/test_scripts/shell_json.py"
    payload_keys: ["status", "count"]
    on_success: intermediate

  # Step 2: 中间 step — 产出无关 payload
  - id: intermediate
    kind: shell
    command: "echo 'doing other things'"
    timeout_seconds: 5
    on_success: final_step

  # Step 3: 跳过 intermediate，直引 json_source
  - id: final_step
    kind: shell
    command: "python3 /Users/yifan/Desktop/OpenRY/example/test_scripts/shell_payload_from.py --status ${payload.status} --count ${payload.count}"
    payload_from: json_source               # 直引 json_source，跳过 intermediate
    timeout_seconds: 10
    on_success: done
    on_failure: abort
