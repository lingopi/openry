# ============================================================================
# semantic_distillation_test — 语义蒸馏测试 workflow
# ============================================================================
# 测试 agent 在真实 session 数据上做语义蒸馏的效果
# 两个 sub_step 分别读取两个真实 session.json，按 8 原语 + concepts 上报
# ============================================================================
name: semantic_distillation_test
version: "1.0"
description: "分别读取两个真实 session 文件，检验 8 原语语义蒸馏质量"
timeout_minutes: 10
max_retries: 0

sub_steps:
  # ── Step 1: 读取 wxb-reply-external session ──
  - id: distill_reply_external
    kind: agent
    description: |
      请读取以下文件内容：
        /Users/yifan/Desktop/OpenRY/docs/6ecf3e4cec8c.json

      这个文件记录了一次 Agent 执行的完整 session（wxb-reply-external 阶段），
      包含拉取邮件、创建回复草稿、Teams 通知等操作。

      请用 openry_run 执行 cat 命令读取该文件：
        openry_run cat /Users/yifan/Desktop/OpenRY/docs/6ecf3e4cec8c.json

      阅读内容后，按语义上报规范对此 session 做蒸馏总结，
      通过 openry_status completed 上报。
    on_success: distill_fetch_bundle
    on_failure: abort
    max_tool_calls: 10
    expect_payload: true

  # ── Step 2: 读取 wxb-fetch-bundle session ──
  - id: distill_fetch_bundle
    kind: agent
    description: |
      请读取以下文件内容：
        /Users/yifan/Desktop/OpenRY/docs/781b57d5d5b0.json

      这个文件记录了一次 Agent 执行的完整 session（wxb-fetch-bundle 阶段），
      包含从 KnowQL 拉取邮件 bundle（含 21 封邮件的完整线程数据）。

      请用 openry_run 执行 cat 命令读取该文件：
        openry_run cat /Users/yifan/Desktop/OpenRY/docs/781b57d5d5b0.json

      阅读内容后，关注其中包含的 21 封邮件线程内容的语义信息
      （邮件的 previous_phase_result 字段），按语义上报规范做蒸馏总结，
      通过 openry_status completed 上报。
    on_success: done
    on_failure: abort
    max_tool_calls: 10
    expect_payload: true
