# ============================================================================
# phase_c_distill_test — Phase C 语义蒸馏测试
# ============================================================================
# 测试完整蒸馏链路：
#   shell step 产出原始 stdout (_compressed: false)
#   → patrol loop 扫描到 → spawn 蒸馏 agent
#   → 蒸馏 agent 蒸馏 → 更新 payload (_compressed: true)
#   → 下游 agent step 拿到蒸馏后的结构化数据
# ============================================================================
name: phase_c_distill_test
version: "1.0"
description: "shell 产出 → 蒸馏 workflow 处理 → 下游消费蒸馏结果"
timeout_minutes: 10
max_retries: 0

sub_steps:
  # ── Step 1: shell 模拟数据拉取（产出原始 stdout）──
  - id: shell_fetch_data
    kind: shell
    command: "cat /Users/yifan/Desktop/OpenRY/docs/781b57d5d5b0.json"
    timeout_seconds: 10
    on_success: agent_consume
    on_failure: abort

  # ── Step 2: agent 消费蒸馏后的数据 ──
  - id: agent_consume
    kind: agent
    description: |
      上一步 shell 拉取了一个 session.json 文件的内容。
      该数据已经过语义蒸馏处理，你拿到的是蒸馏后的结构化结果。

      请阅读上一步的 payload，然后：
      1. 总结这个 session 做了什么
      2. 用 openry_status completed 上报你的理解

      注意：你的 payload 中应包含 concepts 标签和 8 原语中有数据的桶。
    on_success: done
    on_failure: abort
    max_tool_calls: 10
    expect_payload: true
    inherit_payload: true
