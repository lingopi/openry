# ============================================================================
# shell_overflow_fail — 测试 overflow_strategy: fail → dropped
# ============================================================================
name: shell_overflow_fail
version: "1.0"
description: "Phase 3b 溢出终止测试：大输出触发 fail 策略，直接 dropped（不重试）"
timeout_minutes: 1
max_retries: 0

sub_steps:
  - id: step_fail
    kind: shell
    command: "python3 /Users/yifan/Desktop/OpenRY/example/test_scripts/shell_overflow.py large"
    max_output_tokens: 500
    overflow_strategy: fail                 # 溢出 → dropped（终止）
    timeout_seconds: 30
    on_failure: abort
