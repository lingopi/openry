# ============================================================================
# shell_json_abort — 测试 payload_keys_on_error: abort 直接终止
# ============================================================================
name: shell_json_abort
version: "1.0"
description: "Phase 3b JSON abort 测试：非 JSON 输出时直接 dropped"
timeout_minutes: 1
max_retries: 0

sub_steps:
  - id: step_bad_json
    kind: shell
    command: "python3 /Users/yifan/Desktop/OpenRY/example/test_scripts/shell_maybe_json.py text"
    payload_keys: ["result", "value"]
    payload_keys_on_error: abort             # 默认：非 JSON → dropped（终止，不重试）
    timeout_seconds: 10
    on_failure: abort
