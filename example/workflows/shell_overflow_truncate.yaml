# ============================================================================
# shell_overflow_truncate — 测试 overflow_strategy: truncate
# ============================================================================
name: shell_overflow_truncate
version: "1.0"
description: "Phase 3b 溢出截断测试：大输出触发截断，payload 含 _truncated:true"
timeout_minutes: 1
max_retries: 0

sub_steps:
  - id: step_large
    kind: shell
    command: "python3 /Users/yifan/Desktop/OpenRY/example/test_scripts/shell_overflow.py large"
    max_output_tokens: 500                  # 约 2000 字符阈值，脚本输出远超此值
    overflow_strategy: truncate
    timeout_seconds: 30
    on_success: done
    on_failure: abort
