# ============================================================================
# Prompt Blocks Test — 覆盖所有 prompt_blocks 模式
# ============================================================================
# 测试目标：验证 patrol.ts 的 renderPromptBlocks 正确加载所有块类型
#
# 块类型覆盖：
#   1. text + label       → 内联文本带标题
#   2. text only          → 内联文本无标题
#   3. file (相对路径)     → 从 ~/.openry/prompt_blocks/ 找
#   4. file (绝对路径)     → 直接用绝对路径
#   5. file (~ 路径)      → 展开 ~ 到家目录
# ============================================================================
name: prompt_blocks_test
version: "1.0"
description: "测试 prompt_blocks 所有模式：text + file + 路径解析"
timeout_minutes: 5
max_retries: 0

sub_steps:
  - id: verify_all_blocks
    kind: agent
    description: >
      你在 prompt 中应该看到以下内容块。
      请逐一确认它们是否都正确加载了，然后调用 openry_status completed，
      不需要执行任何命令。

      预期看到的块：
      1. "内联文本块 — 带标题" 标题下有一段中文要求
      2. 一段没有标题的内联文本："这是一个没有标题的纯文本块"
      3. "公司风格指南" 标题下包含 Markdown 格式的风格规范
      4. "法律免责声明" 标题下包含引用格式的免责声明
      5. "绝对路径测试" 标题下包含一段文本

      如果以上 5 个块全部正确加载，请在 payload 中报告：
      {"all_blocks_loaded": true, "blocks": ["text_with_label", "text_only", "file_relative", "file_absolute", "file_tilde"]}
    on_success: done
    on_failure: abort
    max_tool_calls: 5
    expect_payload: true
    payload_keys: ["all_blocks_loaded", "blocks"]

    prompt_blocks:
      # 模式 1: text + label
      - type: text
        label: "内联文本块 — 带标题"
        content: "请使用中文回复。语气：专业但不生硬。必须使用 Markdown 格式输出。\n"

      # 模式 2: text only (no label)
      - type: text
        content: "这是一个没有标题的纯文本块，直接追加到 prompt 中。\n"

      # 模式 3: file (相对路径 → ~/.openry/prompt_blocks/style-guide.md)
      - type: file
        path: "style-guide.md"
        label: "公司风格指南"

      # 模式 4: file (相对路径 → ~/.openry/prompt_blocks/legal-disclaimer.md)
      - type: file
        path: "legal-disclaimer.md"
        label: "法律免责声明"

      # 模式 5: file (绝对路径 — 复用 legal-disclaimer 来验证绝对路径)
      - type: file
        path: "/Users/yifan/.openry/prompt_blocks/legal-disclaimer.md"
        label: "绝对路径测试"
